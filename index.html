<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section>
        <div class="info">
          <h2 class="score">High Score: <span id="highScore">{{15}}</span></h2>
          <h2 class="score">Score: <span id="score">0</span></h2>
          <h2 class="score">Time: <span id="time">00-00</span></h2>
        </div>
        <div class="board"></div>
      </section>
      <div class="game-mode">
        <button class="gameModeEasy gameModeBtn" value="easy">Easy</button>
        <button class="gameModeNormal gameModeBtn" value="normal">Normal</button>
        <button class="gameModeHard gameModeBtn" value="hard">Hard</button>
      </div>
      <!-- <div class="modal">
        <h2>Press Spacebar to Play Game</h2>
      </div> -->
    </main>
    <script src="newscript.js"></script>
  </body>
</html>
